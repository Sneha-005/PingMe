[versions]
androidx-core-ktx = "1.17.0"
androidx-lifecycle-runtime-ktx = "2.9.4"
androidx-activity-compose = "1.11.0"
androidx-compose-bom = "2023.10.00" # Use the latest stable version
androidx-material3 = "1.4.0"
androidx-hilt-compose-navigation = "1.3.0"
coil-compose = "2.6.0"
gradle = "8.1.4"
hilt = "2.54"
ksp = "2.0.0-1.0.22"
kotlinx-coroutines = "1.9.0"
